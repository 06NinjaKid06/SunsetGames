<!DOCTYPE html>
<html>
<head>
<title>Sunset Games</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Press Start 2P', monospace;
    background: #000;
    min-height: 600px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
  }

  .bg-sky {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(180deg, #7ec8e3 0%, #a8d8ea 100%);
    z-index: 0;
  }

  .bg-ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 45%;
    z-index: 0;
  }

  .ground-layer { width: 100%; display: flex; flex-wrap: wrap; }

  .block { width: 32px; height: 32px; flex-shrink: 0; image-rendering: pixelated; }
  .grass-block {
    background: #5d9e3f;
    border-top: 4px solid #7bc34a;
    border-left: 2px solid rgba(255,255,255,0.2);
    border-right: 2px solid rgba(0,0,0,0.2);
  }
  .dirt-block {
    background: #8b5e3c;
    border: 1px solid rgba(0,0,0,0.2);
    background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px);
  }

  .clouds { position: absolute; top: 6%; left: 0; right: 0; z-index: 1; }
  .cloud { position: absolute; background: white; opacity: 0.9; image-rendering: pixelated; }
  .cloud-1 { top: 0; left: 5%; width: 80px; height: 24px; }
  .cloud-1::before { content:''; position:absolute; width:48px; height:24px; background:white; top:-16px; left:8px; }
  .cloud-1::after { content:''; position:absolute; width:32px; height:24px; background:white; top:-8px; left:36px; }
  .cloud-2 { top: 10px; left: 40%; width: 96px; height: 24px; }
  .cloud-2::before { content:''; position:absolute; width:56px; height:24px; background:white; top:-16px; left:16px; }
  .cloud-3 { top: 0; right: 10%; width: 64px; height: 24px; }
  .cloud-3::before { content:''; position:absolute; width:40px; height:24px; background:white; top:-12px; left:8px; }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    padding-bottom: 20px;
  }

  .logo-wrap {
    margin-bottom: 24px;
    position: relative;
    display: inline-block;
  }

  .logo-img {
    display: block;
    width: 360px;
    image-rendering: pixelated;
    filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.6));
  }

  .splash {
    position: absolute;
    bottom: 108px;
    right: -90px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #ffff55;
    text-shadow: 1px 1px 0 #000, 2px 2px 0 rgba(0,0,0,0.4);
    line-height: 1.7;
    text-align: center;
    white-space: nowrap;
    transform-origin: center center;
    animation: bounce 0.55s ease-in-out infinite alternate;
    transform: rotate(-20deg);
  }

  @keyframes bounce {
    0%   { transform: rotate(-20deg) scale(1); }
    100% { transform: rotate(-20deg) scale(1.13); }
  }

  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 340px;
  }
	
  .mc-btn {
    width: 100%;
    padding: 10px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #fff;
    text-shadow: 1px 1px 0 #3f3f3f;
    letter-spacing: 0.5px;
    background: #6a6a6a;
    border: none;
    cursor: pointer;
    outline: none;
    border-top: 2px solid #9e9e9e;
    border-left: 2px solid #9e9e9e;
    border-right: 2px solid #3a3a3a;
    border-bottom: 2px solid #3a3a3a;
    text-align: center;
    image-rendering: pixelated;
  }

  .mc-btn:hover {
    background: #7a7af0;
    border-top: 2px solid #afafff;
    border-left: 2px solid #afafff;
    border-right: 2px solid #4040c0;
    border-bottom: 2px solid #4040c0;
    color: #ffffc0;
  }

  .mc-btn:active {
    background: #5050d0;
    border-top: 2px solid #3a3aaa;
    border-left: 2px solid #3a3aaa;
    border-right: 2px solid #8888ee;
    border-bottom: 2px solid #8888ee;
  }

  .btn-row { display: flex; gap: 6px; width: 100%; }
  .mc-btn.half { width: calc(50% - 3px); }

  .version {
    position: fixed; bottom: 8px; left: 12px;
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: rgba(255,255,255,0.5); text-shadow: 1px 1px 0 #000; z-index: 20;
  }
</style>
</head>
<body>

<div class="bg-sky"></div>
<div class="clouds">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
</div>
<div class="bg-ground" id="ground"></div>

<div class="content">
  <div class="logo-wrap">
    <img class="logo-img" src="logo.png" alt="Sunset Games 2026 Update" onerror="this.onerror=null;this.src='https://i.imgur.com/LePob9I.png';" />
    <div class="splash" id="splash">Also try Red's Exploit Corner!</div>
  </div>

  <div class="buttons">
    <button class="mc-btn" onclick="gd()">Geometry Dash 2.1</button>
    <button class="mc-btn" onclick="rec()">Red's Exploit Corner (OLD)</button>
    <button class="mc-btn" onclick="mj()">about:blank-ify</button>
    <div class="btn-row">
      <button class="mc-btn half" onclick="pr()">PokeRogue</button>
      <button class="mc-btn half" onclick="mg()">More Games</button>
    </div>
  </div>
</div>

<div class="version">Sunset Games 26.9.1</div>

<script>
  const ground = document.getElementById('ground');
  const cols = Math.ceil(window.innerWidth / 32) + 2;

  const grassRow = document.createElement('div');
  grassRow.className = 'ground-layer';
  grassRow.style.height = '32px';
  for (let i = 0; i < cols; i++) {
    const b = document.createElement('div');
    b.className = 'block grass-block';
    grassRow.appendChild(b);
  }
  ground.appendChild(grassRow);

  for (let r = 0; r < 32; r++) {
    const row = document.createElement('div');
    row.className = 'ground-layer';
    row.style.height = '32px';
    for (let i = 0; i < cols; i++) {
      const b = document.createElement('div');
      b.className = 'block dirt-block';
      row.appendChild(b);
    }
    ground.appendChild(row);
  }

  const splashes = [
    "Also try Red's Exploit Corner!",
    "Now with MORE games!",
    "More coming soon!",
    "Fork on GitHub!",
    "Let's hope this doesn't get blocked...",
    "Last updated 9/1/26!",
    "Do your school work!",
    "Made by coliinn_!",
    "https://discord.gg/W9knBrxfC2",
    "I need to touch grass...",
    "Background W.I.P, will be more accurate soon."
  ];


  function pickRandom(exclude) {
    let idx;
    do { idx = Math.floor(Math.random() * splashes.length); }
    while (idx === exclude && splashes.length > 1);
    return idx;
  }

  const el = document.getElementById('splash');
  let current = pickRandom(-1);
  el.textContent = splashes[current];
  
  setInterval(() => {
    current = pickRandom(current);
    el.textContent = splashes[current];
  }, 3000000);

	var click = new Audio('Click.mp3');

function gd() {
  window.location.href = "https://sunsetgames.netlify.app/gdlite/";
  click.play();
}

function rec() {
  window.location.href = "https://sunsetexploitcorner.netlify.app/";
  click.play();
}

function pr() {
	window.location.href= "https://pokerogue.122399.xyz/";
	click.play();
}

function mg() {
	window.location.href = "moregames.html";
	click.play();
}

function mj() {
	click.play();
	var win = window.open(url, '_blank', 'fullscreen=yes');
        var url = "https://sunsetgames.netlify.app/"
        var iframe = win.document.createElement('iframe')
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.src = url
        win.document.body.appendChild(iframe)
}
  
</script>
</body>
</html>
